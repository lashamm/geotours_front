<!-- ─── Page hero ───────────────────────────────────────── -->
<section class="page-hero">
  <div class="hero-bg">
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1800&q=80" alt="">
    <div class="hero-overlay"></div>
  </div>

  <div class="container hero-content">
    <p class="section-label">{{ T.label }}</p>
    <h1 class="hero-title">{{ T.title }}</h1>
    <p class="hero-sub">
      <span class="count">{{ tours.length }}</span>
      {{ T.sub }}
    </p>
  </div>

  <div class="hero-fade"></div>
</section>

<!-- ─── Tours grid ──────────────────────────────────────── -->
<section class="tours-section">
  <div class="container">
    <div class="tours-grid">
      @for (tour of tours; track tour.id) {
        <app-tour-card [tour]="tour"></app-tour-card>
      }
    </div>
  </div>
</section>

<!-- ─── CTA strip ───────────────────────────────────────── -->
<section class="cta-strip">
  <div class="container">
    <div class="cta-card">
      <div>
        <p class="section-label">Bespoke</p>
        <h2 class="section-title">{{ T.ctaTitle }}</h2>
        <div class="divider"></div>
        <p>{{ T.ctaText }}</p>
      </div>

      <a routerLink="/contact" class="btn-primary">
        {{ T.ctaBtn }}
      </a>
    </div>
  </div>
</section>
