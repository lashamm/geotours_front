<div class="cs-wrap">
  <div class="cs-stage"
       (touchstart)="onTouchStart($event)"
       (touchend)="onTouchEnd($event)">
    @for (car of cars; track car.id; let i = $index) {
      <div class="cs-slide" [class.active]="i === activeIndex">
        <div class="cs-img-wrap">
          <img [src]="car.image" [alt]="car.name" class="cs-img">
        </div>
        <div class="cs-info">
          <span class="cs-tag">{{ car.tag }}</span>
          <h3 class="cs-name">{{ car.name }}</h3>
          <p class="cs-desc">{{ car.description }}</p>
        </div>
      </div>
    }

    <button class="cs-arrow cs-prev" (click)="prev()" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
    </button>
    <button class="cs-arrow cs-next" (click)="next()" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,18 15,12 9,6"/>
      </svg>
    </button>
  </div>

  <div class="cs-dots">
    @for (car of cars; track car.id; let i = $index) {
      <button class="cs-dot" [class.active]="i === activeIndex" (click)="goTo(i)"></button>
    }
  </div>
</div>
